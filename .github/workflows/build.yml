name: build-ds2-nx
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag a compilar (vacío = la última versión)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64
    timeout-minutes: 240
    steps:
      - name: Dependencias
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git cmake ninja-build python3 ca-certificates build-essential
          dkp-pacman -S --noconfirm switch-dev deko3d

      - name: Buscar versión
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG=$(git ls-remote --tags --refs --sort=-v:refname https://github.com/VasilkovND/ds2-nx 'v*' | head -n1 | sed 's|.*refs/tags/||')
          fi
          echo "Compilando $TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Clonar ds2-nx
        run: |
          git config --global --add safe.directory '*'
          git clone --branch "$TAG" https://github.com/VasilkovND/ds2-nx

      - name: Compilar
        working-directory: ds2-nx
        run: bash deadspace2/tools/build_mac.sh

      - name: Renombrar NRO
        run: cp ds2-nx/deadspace2/out/sw/deadspace2.nro ds2-nx.nro

      - uses: actions/upload-artifact@v4
        with:
          name: ds2-nx-${{ env.TAG }}
          path: ds2-nx.nro
